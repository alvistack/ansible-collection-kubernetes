- name: reboot | all:!ansible
  hosts: all:!ansible
  remote_user: root
  become: true
  tasks:
    - name: check
      ansible.builtin.shell:
        cmd: |
          cat > /tmp/test_command.sh <<\EOF
          #!/bin/bash
          set -euxo pipefail
          ceph crash archive-all
          [ $(ceph health detail | grep -c 'HEALTH_OK') -eq 1 ]
          [ $(kubectl get --raw='/readyz?verbose' | grep -c 'check passed') -eq 1 ]
          [ $(kubectl get pod --all-namespaces --no-headers | grep -c -E '(Pending|Failed|CrashLoopBackOff)') -eq 0 ]
          EOF
          chmod a+x /tmp/test_command.sh
          /tmp/test_command.sh
      register: result
      changed_when: result is not succeeded
      until: result is succeeded
      retries: 60

    - name: reboot
      ansible.builtin.reboot:
        connect_timeout: 300
        reboot_timeout: 3600
        pre_reboot_delay: 60
        post_reboot_delay: 60
        test_command: /tmp/test_command.sh
      throttle: 1
      changed_when: false
      failed_when: false

- name: reboot | ansible
  hosts: ansible
  remote_user: root
  become: true
  tasks:
    - name: reboot
      ansible.builtin.reboot:
        connect_timeout: 300
        reboot_timeout: 3600
        pre_reboot_delay: 60
        post_reboot_delay: 60
        test_command: whoami
      throttle: 1
      changed_when: false
      failed_when: false
